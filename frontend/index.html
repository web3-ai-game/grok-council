<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141413" />
    <meta property="og:title" content="grok-council" />
    <meta property="og:description" content="Gate, parallel answers, cross-review, chair. Offline replay. No key." />
    <meta property="og:image" content="https://web3-ai-game.github.io/grok-council/og.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/192.png" />
    <title>grok-council</title>
    <script>
      try {
        var lights = localStorage.getItem("oece-lights");
        if (lights !== "on" && lights !== "off") {
          lights = window.matchMedia("(prefers-color-scheme: light)").matches ? "on" : "off";
        }
        document.documentElement.dataset.lights = lights;
      } catch (e) {}
    </script>
    <script>
      try {
        var p = JSON.parse(localStorage.getItem("oece-x-prefs") || "{}");
        var t = p.theme || "system";
        var dark =
          t === "dark" ||
          (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
